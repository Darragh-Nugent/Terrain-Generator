<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Terrain Generator</title>
  <link rel="stylesheet" href="/styles/styles.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    #loginSection,
    #terrainSection {
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      margin: 5px 0;
      cursor: pointer;
    }

    button {
      margin-left: 10px;
    }

    select {
      margin-left: 10px;
    }

    img {
      max-width: 600px;
      display: block;
      margin-top: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #ccc;
      padding: 5px;
      text-align: center;
    }

    /* Hide the main content initially */
    #mainContent {
      display: none;
    }

    #loading {
      font-size: 1.2rem;
      text-align: center;
      margin-top: 2rem;
    }
  </style>
</head>

<body>
  <header>
    <div class="header-buttons">
      <button type="button" id="register" onclick="home()">Home Page</button>
    </div>
  </header>
  <div id="loading">Checking authentication...</div>
  <div id="mainContent">
    <h1>Terrain Generator</h1>

    <!-- Terrains -->
    <div id="terrainSection" class="hidden">
      <h2>Your Terrains</h2>
      <table id="terrainList">
        <thead>
          <tr>
            <th>Seed</th>
            <th>Size</th>
            <th>Height Scale</th>
            <th>Octaves</th>
            <th>Iterations</th>
            <th>3D Map</th>
            <th>Height Map</th>
            <th>Style</th>
            <th>Delete</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>

      <button onclick="addTerrain()">Add Terrain</button>

      <div id="terrainDisplay">
        <h3>Selected Terrain</h3>
        <img id="terrainImage" src="" alt="Terrain will appear here">
      </div>
    </div>
  </div>

  <script>

    async function checkAuth() {
      const loadingDiv = document.getElementById('loading');
      const mainContent = document.getElementById('mainContent');

      const token = localStorage.getItem("accessToken");
      if (!token) {
        // No token, redirect to login
        alert(`Please log in to access this feature`);
        window.location.href = '/user/login';
      }

      try {
        // Call your protected auth-check API endpoint
        const res = await fetch('/auth/me', {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });
        if (res.ok) {
          // Auth success — show main content, hide loading
          loadingDiv.style.display = 'none';
          mainContent.style.display = 'block';
        } else {
          // Auth failed — redirect to login or show error
          const err = await res.json();
          localStorage.removeItem('accessToken');
          localStorage.removeItem('idToken');
          localStorage.removeItem('userInfo');
          alert('Access denied: ' + err.error);
          window.location.href = '/user/login';
        }
      } catch (err) {
        // Network or unexpected error — redirect to login for safety
        alert(`Unexpected error: `, err);
        window.location.href = '/user/login';
      }
    }

    const token = localStorage.getItem("accessToken");
    const id = new URLSearchParams(window.location.search).get('id');
    function home() {
      window.location.href = id ? `/?id=${id}` : `/`;
    }
    const API_BASE = "";

    function show(section) {
      document.getElementById("terrainSection").classList.add("hidden");
      document.getElementById(section).classList.remove("hidden");
    }

    async function loadTerrains() {
      const res = await fetch(`${API_BASE}/terrain/getAllTerrainsFromUser`, {
        method: 'GET',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        }
      });
      const terrains = await res.json();
      const options = await getStyleOptions();

      const tableBody = document.querySelector("#terrainList tbody");
      tableBody.innerHTML = "";

      for (const terrain of terrains) {
        const row = document.createElement("tr");

        const seedValue = document.createElement("input");
        seedValue.type = 'number';
        seedValue.value = terrain.seed;

        const sizeValue = document.createElement("input");
        sizeValue.type = 'number';
        sizeValue.value = terrain.size;

        const heightScaleValue = document.createElement("input");
        heightScaleValue.type = 'number';
        heightScaleValue.value = terrain.heightScale;

        const octavesValue = document.createElement("input");
        octavesValue.type = 'number';
        octavesValue.value = terrain.octaves;

        const iterationsValue = document.createElement("input");
        iterationsValue.type = 'number';
        iterationsValue.value = terrain.iterations;

        const changeHandler = () =>
          editTerrain(terrain.id, seedValue, sizeValue, heightScaleValue, octavesValue, iterationsValue);

        [seedValue, sizeValue, heightScaleValue, octavesValue, iterationsValue]
          .forEach(input => input.addEventListener("change", changeHandler));

        const makeCell = (el) => {
          const td = document.createElement("td");
          td.appendChild(el);
          return td;
        };

        const load3DBtn = document.createElement("button");
        load3DBtn.innerText = "3D Map";
        load3DBtn.onclick = () => showTerrain(terrain.id, changeStyleDrop.value);

        const loadMapBtn = document.createElement("button");
        loadMapBtn.innerText = "Map";
        loadMapBtn.onclick = () => showMap(terrain.id);

        const changeStyleDrop = document.createElement("select");
        options.forEach(style => {
          const option = document.createElement("option");
          option.value = style;
          option.textContent = style;
          changeStyleDrop.appendChild(option);
        });

        const delBtn = document.createElement("button");
        delBtn.innerText = "Delete";
        delBtn.onclick = (e) => { e.stopPropagation(); deleteTerrain(terrain.id); };

        // Append all to the row
        row.appendChild(makeCell(seedValue));
        row.appendChild(makeCell(sizeValue));
        row.appendChild(makeCell(heightScaleValue));
        row.appendChild(makeCell(octavesValue));
        row.appendChild(makeCell(iterationsValue));
        row.appendChild(makeCell(load3DBtn));
        row.appendChild(makeCell(loadMapBtn));
        row.appendChild(makeCell(changeStyleDrop));
        row.appendChild(makeCell(delBtn));

        tableBody.appendChild(row);
      }

    }

    async function showTerrain(id, style) {
      try {
        const res = await fetch(`${API_BASE}/terrain/get3DTerrain?id=${id}&styleQuery=${style}`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (!res.ok) {
          throw new Error(`Failed to load image: ${res.statusText}`);
        }

        const image = await res.json();
        const imageUrl = image.url;

        const img = document.getElementById("terrainImage");
        img.src = imageUrl;

      } catch (err) {
        console.error("Error loading height map:", err);
      }
    }

    async function showMap(id) {
      try {
        const res = await fetch(`${API_BASE}/terrain/getHeightMapImage?id=${id}`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
          }
        });

        if (!res.ok) {
          throw new Error(`Failed to load image: ${res.statusText}`);
        }

        const image = await res.json();
        const imageUrl = image.url;

        const img = document.getElementById("terrainImage");
        img.src = imageUrl;

      } catch (err) {
        console.error("Error loading height map:", err);
      }
    }

    async function getStyleOptions() {
      try {
        const res = await fetch(`${API_BASE}/style/`, {
          method: 'GET',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (!res.ok) {
          throw new Error(`Failed to load styles: ${res.statusText}`);
        }
        const styles = await res.json();

        const styleNames = []
        styles.forEach(style => {
          styleNames.push(style.name);
        });

        return styleNames;


      } catch (err) {
        console.error("Error loading styles:", err);
      }
    }

    async function addTerrain() {
      const seed = 12345;
      const size = 124;
      const heightScale = 1000;
      const octaves = 8;
      const iterations = 50;

      try {
        const res = await fetch(`${API_BASE}/terrain/addTerrain`, {
          method: "POST",
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ seed, size, heightScale, octaves, iterations })
        });

        if (!res.ok) {
          const msg = await res.text();
          throw new Error(`Add Terrain failed: ${msg}`);
        }

        await loadTerrains();
      } catch (err) {
        alert(err.message);
        console.error("Error adding terrain:", err);
      }
    }

    async function editTerrain(id, seedEl, sizeEl, heightScaleEl, octavesEl, iterationsEl) {
      const seed = seedEl.value;
      const size = sizeEl.value;
      const heightScale = heightScaleEl.value;
      const octaves = octavesEl.value;
      const iterations = iterationsEl.value;


      try {
        const res = await fetch(`${API_BASE}/terrain/editTerrain`, {
          method: "POST",
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ id, seed, size, heightScale, octaves, iterations })
        });

        if (!res.ok) {
          const msg = await res.text();
          throw new Error(`Edit Terrain failed: ${msg}`);
        }

        await loadTerrains();
      } catch (err) {
        alert(err.message);
        console.error("Error adding terrain:", err);
      }
    }

    async function deleteTerrain(id) {
      await fetch(`${API_BASE}/terrain/deleteTerrain?id=${id}`, {
        method: "DELETE",
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
      });
      await loadTerrains();
    }

    window.onload = async () => {
      await checkAuth();

      try {
        loadTerrains();
        show("terrainSection");
      } catch (err) {
        console.error("Error loading terrains on page load:", err);
        alert("Failed to load terrains.");
      }
    }

  </script>
</body>

</html>
