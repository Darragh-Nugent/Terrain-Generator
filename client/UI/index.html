<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Welcome To WinterScape</title>
  <link rel="stylesheet" href="/styles/styles.css" />
</head>

<body>
  <header>
    <div class="header-buttons">
      <button type="button" id="settings" onclick="go_settings()" style="display:none">Settings</button>
      <button type="button" onclick="go_simulation()">2D Render - Chione Engine</button>
      <button type="button" onclick="go_3d_simulation()">3D Render - Chione Engine</button>
      <button type="button" onclick="go_terrain_generator()">Terrain Generator</button>
      <button type="button" id="login" onclick="go_login()" style="display:none">Login</button>
      <button type="button" id="register" onclick="go_register()" style="display:none">Register</button>
    </div>
  </header>

  <div class="center_container">
    <div id="welcome">
      <h1><strong>Welcome To WinterScape</strong></h1>
      <div id="error" style="color: red; margin-top: 10px;"></div>
    </div>
  </div>

  <script>
    const errorDiv = document.getElementById('error');
    const welcomeDiv = document.getElementById('welcome');
    const id = new URLSearchParams(window.location.search).get('id');

    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

    const userInfoCookie = getCookie('userInfo');
    let user = null;

    if (userInfoCookie) {
      try {
        user = JSON.parse(decodeURIComponent(userInfoCookie));
        if (user) {
          welcomeDiv.innerHTML = `<h1><strong>Welcome ${user.username}, To WinterScape</strong></h1>`;
          if (user.id && !id) window.location.href = `/?id=${user.id}`;
        } else {
          showGuestMessage();
        }
      } catch (e) {
        showGuestMessage();
      }
    } else {
      showGuestMessage();
      if (id) window.location.href = `/`; // prevent invalid id access
    }

    // Show appropriate buttons
    if (id && user?.id) {
      document.getElementById('settings').style.display = 'inline-block';
    } else {
      document.getElementById('login').style.display = 'inline-block';
      document.getElementById('register').style.display = 'inline-block';
    }

    function showGuestMessage() {
      welcomeDiv.innerHTML = `
        <h1><strong>Welcome To WinterScape:</strong></h1>
        <h4>Please log in to access all features</h4>`;
    }

    // Navigation Functions
    function go_login() {
      window.location.href = '/user/login';
    }

    function go_register() {
      window.location.href = '/user/register';
    }

    function go_simulation() {
      window.location.href = id
        ? `/simulation/simulation-snow-page/?id=${id}`
        : `/simulation/simulation-snow-page`;
    }

    async function go_3d_simulation() {
      try {
        const res = await fetch('/simulation/3d-snowfall-simulation', {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
        });

        if (res.ok) {
          window.location.href = `/simulation/3d-snowfall-simulation/?id=${id}`;
        } else {
          const err = await res.json();
          errorDiv.textContent = 'Unauthorized: Please log in!';
          alert('Access denied: ' + err.error);
        }
      } catch (error) {
        console.error('Error checking auth:', error);
        errorDiv.textContent = 'Network error: ' + (error.message || 'Unknown error');
      }
    }

    async function go_settings() {
      try {
        const res = await fetch(`/user/${id}/update`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
        });

        if (res.ok) {
          window.location.href = `/user/${id}/update`;
        } else {
          const err = await res.json();
          alert('Access denied: ' + err.error);
        }
      } catch (error) {
        console.error('Error checking auth:', error);
      }
    }

    async function go_terrain_generator() {
      try {
        const res = await fetch(`/terrain/Terrain-Generator/${id}/`, {
          method: 'GET',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
        });

        if (res.ok) {
          window.location.href = `/terrain/Terrain-Generator/${id}/`;
        } else {
          const err = await res.json();
          alert('Access denied: ' + err.error);
        }
      } catch (error) {
        console.error('Error checking auth:', error);
      }
    }
  </script>
</body>

</html>
