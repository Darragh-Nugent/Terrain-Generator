services:
  backend:
    build: .
    env_file:
      - .env
    image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/n11547227-a2:latest
    container_name: terrain-generator-backend
    ports:
      - "3000:3000" # host:container
    volumes:
      - ./videos:/videos
    environment:
      NODE_ENV: development
      DB_HOST: ${DB_HOST}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      S3_BUCKET: ${S3_BUCKET}
      DYNAMO_NAME: ${DYNAMO_NAME}
     

  redis:
    image: redis:alpine 
    container_name: redis
    volumes:
      - redis-data:/data 
    restart: always   

volumes:
  redis-data: