Description: Launches an EC2 instance via AutoScalingGroup and runs the Terrain Generator container

Parameters:
  QutUsername:
    Type: String
    Default: n11547227@qut.edu.au
  QutUsername2:
    Type: String
    Default: n11596708@qut.edu.au
  Purpose:
    Type: String
    Default: assessment 2
  Subnet1:
    Type: String
    Default: subnet-075811427d5564cf9
  Subnet2:
    Type: String
    Default: subnet-05a3b8177138c8b14
  Subnet3:
    Type: String
    Default: subnet-04ca053dcbe5f49cc
  SecurityGroup:
    Type: String
    Default: sg-032bd1ff8cf77dbb9


Resources:   

 ##################### Target Groups #####################################
 TerrainTargetGroup:
  Type: AWS::ElasticLoadBalancingV2::TargetGroup
  Properties:
    Name: Group-88-tg-terrain
    Port: 3002
    Protocol: HTTP
    VpcId: vpc-007bab53289655834
    HealthCheckProtocol: HTTP
    HealthCheckPort: traffic-port
    HealthCheckPath: /
    HealthCheckEnabled: true
    HealthCheckIntervalSeconds: 30
    HealthCheckTimeoutSeconds: 5
    HealthyThresholdCount: 5
    UnhealthyThresholdCount: 2
    Matcher:
      HttpCode: 200
    TargetType: ip
    ProtocolVersion: HTTP1
    IpAddressType: ipv4
    Tags:
      - Key: purpose
        Value: assessment 3
      - Key: qut-username
        Value: n11547227@qut.edu.au
      - Key: qut-username2
        Value: n11596708@qut.edu.au

  SnowTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: Group-88-tg-snow
      Port: 3001
      Protocol: HTTP
      VpcId: vpc-007bab53289655834
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      TargetType: ip
      ProtocolVersion: HTTP1
      IpAddressType: ipv4
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au

  AuthdataTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: Group-88-tg-authdata
      Port: 3003
      Protocol: HTTP
      VpcId: vpc-007bab53289655834
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      TargetType: ip
      ProtocolVersion: HTTP1
      IpAddressType: ipv4
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au

  ######################### ECS Tasks ########################################  
  TerrainTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: Group-88-Winterscape-terrain
      Cpu: '2048'
      Memory: '4096'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      ExecutionRoleArn: arn:aws:iam::901444280953:role/Execution-Role-CAB432-ECS
      TaskRoleArn: arn:aws:iam::901444280953:role/Task-Role-CAB432-ECS
      ContainerDefinitions:
        - Name: terrain
          Image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/group-88-terrain:latest
          Essential: true
          Cpu: 0
          PortMappings:
            - ContainerPort: 3002
              HostPort: 3002
              Protocol: tcp
              Name: terrain-3002-tcp
              AppProtocol: http
          Environment:
            - Name: S3_BUCKET
              Value: !Ref S3BucketParameter
            - Name: DB_NAME
              Value: !Ref DatabaseNameParameter
            - Name: DYNAMO_NAME
              Value: !Ref DynamoNameParameter
            - Name: DB_HOST
              Value: !Ref DatabaseHostParameter
            - Name: DB_USER
              Value: !Ref DatabaseUserParameter
            - Name: MEMCACHED_URL
              Value: !Ref MemcachedURLParameter
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: arn:aws:secretsmanager:ap-southeast-2:901444280953:secret:n11547227/terrain-app/db-password
      Tags:
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au
        - Key: purpose
          Value: assessment 3
        
  SnowTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: Group-88-Winterscape-snow
      Cpu: '2048'
      Memory: '4096'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      ExecutionRoleArn: arn:aws:iam::901444280953:role/Execution-Role-CAB432-ECS
      TaskRoleArn: arn:aws:iam::901444280953:role/Task-Role-CAB432-ECS
      ContainerDefinitions:
        - Name: snow
          Image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/group-88-snow:latest
          Essential: true
          Cpu: 0
          PortMappings:
            - ContainerPort: 3001
              HostPort: 3001
              Protocol: tcp
              Name: snow-3001-tcp
              AppProtocol: http
          Environment:
            - Name: S3_BUCKET
              Value: !Ref S3BucketParameter
            - Name: MEMCACHED_URL
              Value: !Ref MemcachedURLParameter
      Tags:
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au
        - Key: purpose
          Value: assessment 3

  AuthdataTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: Group-88-Winterscape-authdata
      Cpu: '512'
      Memory: '1024'
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      ExecutionRoleArn: arn:aws:iam::901444280953:role/Execution-Role-CAB432-ECS
      TaskRoleArn: arn:aws:iam::901444280953:role/Task-Role-CAB432-ECS
      ContainerDefinitions:
        - Name: authdata
          Image: 901444280953.dkr.ecr.ap-southeast-2.amazonaws.com/group-88-authdata:latest
          Essential: true
          Cpu: 0
          PortMappings:
            - ContainerPort: 3003
              HostPort: 3003
              Protocol: tcp
              Name: authdata-3003-tcp
              AppProtocol: http
          Environment:
            - Name: S3_BUCKET
              Value: !Ref S3BucketParameter
            - Name: DB_NAME
              Value: !Ref DatabaseNameParameter
            - Name: DYNAMO_NAME
              Value: !Ref DynamoNameParameter
            - Name: DB_HOST
              Value: !Ref DatabaseHostParameter
            - Name: DB_USER
              Value: !Ref DatabaseUserParameter
            - Name: MEMCACHED_URL
              Value: !Ref MemcachedURLParameter
          Secrets:
            - Name: DB_PASSWORD
              ValueFrom: arn:aws:secretsmanager:ap-southeast-2:901444280953:secret:n11547227/terrain-app/db-password
      Tags:
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au
        - Key: purpose
          Value: assessment 3

  ######################### ECS Service ########################################
  TerrainService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: arn:aws:ecs:ap-southeast-2:901444280953:cluster/n11547227-prac
      ServiceName: Group-88-Winterscape-terrain-service-1
      TaskDefinition: arn:aws:ecs:ap-southeast-2:901444280953:task-definition/Group-88-Winterscape-terrain:3
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
            - !Ref Subnet3
      LoadBalancers:
        - TargetGroupArn: arn:aws:elasticloadbalancing:ap-southeast-2:901444280953:targetgroup/Group-88-tg-terrain/42f689d024b8226d
          ContainerName: terrain
          ContainerPort: 3002
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au

  SnowService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: arn:aws:ecs:ap-southeast-2:901444280953:cluster/n11547227-prac
      ServiceName: Group-88-Winterscape-snow-service-1
      TaskDefinition: arn:aws:ecs:ap-southeast-2:901444280953:task-definition/Group-88-Winterscape-snow:1
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
            - !Ref Subnet3
      LoadBalancers:
        - TargetGroupArn: arn:aws:elasticloadbalancing:ap-southeast-2:901444280953:targetgroup/Group-88-tg-snow/371f272de82fd768
          ContainerName: snow
          ContainerPort: 3001
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au

  AuthdataService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: arn:aws:ecs:ap-southeast-2:901444280953:cluster/n11547227-prac
      ServiceName: Group-88-Winterscape-authdata-service-1
      TaskDefinition: arn:aws:ecs:ap-southeast-2:901444280953:task-definition/Group-88-Winterscape-authdata:1
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
            - !Ref Subnet3
      LoadBalancers:
        - TargetGroupArn: arn:aws:elasticloadbalancing:ap-southeast-2:901444280953:targetgroup/Group-88-tg-authdata/234554fe7f6f138a
          ContainerName: authdata
          ContainerPort: 3003
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au

  ############ Cognito User Pool ###############################
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: "Assessment 2 - Group 88 - WinterScape"
      MfaConfiguration: "ON"
      EnabledMfas: 
        - EMAIL_OTP
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: sub
          AttributeDataType: String
          Mutable: false
          Required: true
          StringAttributeConstraints:
            MinLength: "1"
            MaxLength: "2048"
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
          StringAttributeConstraints:
            MinLength: "0"
            MaxLength: "2048"
        - Name: email_verified
          AttributeDataType: Boolean
          Mutable: true
          Required: false
      AutoVerifiedAttributes:
        - email
      VerificationMessageTemplate:
        DefaultEmailOption: "CONFIRM_WITH_CODE"
      EmailConfiguration:
        EmailSendingAccount: "DEVELOPER"
        SourceArn: "arn:aws:ses:ap-southeast-2:901444280953:identity/cab432.com"
        From: "CAB432 logins <logins@cab432.com>"
      EmailVerificationMessage: "Your verification code is {####}."
      EmailVerificationSubject: CAB432 - Please verify your email
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: []
      DeletionProtection: "ACTIVE"
      UsernameConfiguration:
        CaseSensitive: false
      UserPoolTags:
        qut-username: "n11596708@qut.edu.au"
        qut-username2: "n11547227@qut.edu.au"

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: "WinterScape - Group 88 - Assessment 2"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true   # client secret
      ExplicitAuthFlows:
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
      SupportedIdentityProviders:
        - COGNITO
      CallbackURLs:
        - "https://d84l1y8p4kdic.cloudfront.net"
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - phone
      AllowedOAuthFlowsUserPoolClient: true
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      EnablePropagateAdditionalUserContextData: false
      AuthSessionValidity: 3
  
  ############ DynamoDB Table ###############################
  TerrainStylesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: n11547227-styles
      AttributeDefinitions:
        - AttributeName: qut-username
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: qut-username
          KeyType: HASH 
        - AttributeName: id
          KeyType: RANGE 
      BillingMode: PAY_PER_REQUEST
      Tags:
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au
        - Key: purpose
          Value: assessment 2

  ############ S3 Bucket ###############################
  TerrainBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: n11547227-a2-terrains

  ############# SSM Parameters ###############################
    S3BucketParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/n11547227/terrain-app/s3-bucket"
      Type: String
      Value: "n11547227-a2-terrains"
  
  MemcachedCluster:
    Type: AWS::ElastiCache::CacheCluster
    Properties:
      CacheNodeType: cache.t3.micro 
      Engine: memcached
      NumCacheNodes: 1
      ClusterName: group-88-winterscape-memcache 
      CacheSubnetGroupName: "CAB432-subnets"
      VpcSecurityGroupIds:
        - sg-07707a36aa1599475

  DynamoNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/n11547227/terrain-app/dynamo-name"
      Type: String
      Value: "n11547227-styles"

  DatabaseUserParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/n11547227/terrain-app/db-username"
      Type: String
      Value: "s289"

  DatabaseHostParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/n11547227/terrain-app/db-host"
      Type: String
      Value: "database-1-instance-1.ce2haupt2cta.ap-southeast-2.rds.amazonaws.com"
  
  DatabaseNameParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/n11547227/terrain-app/db-name"
      Type: String
      Value: "cohort_2025"

  MemcachedURLParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: "/n11547227/terrain-app/memcached-url"
      Type: String
      Value: "group-88-winterscape-memcache.km2jzi.cfg.apse2.cache.amazonaws.com:11211"

  
  ########### Secrets Manager ###############################
  CognitoSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: "n11547227/terrain-app/cognito-credentials3"
      Description: "Cognito client credentials and user pool ID"
      SecretString: !Sub |
        {
          "client_id": "${CognitoUserPoolClient.ClientId}",
          "client_secret": "${CognitoUserPoolClient.ClientSecret}",
          "user_pool_id": "${CognitoUserPool}"
        }
      Tags:
        - Key: qut-username
          Value: !Ref QutUsername
        - Key: qut-username2
          Value: !Ref QutUsername2
        - Key: purpose
          Value: !Ref Purpose

Outputs:
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
    Export:
      Name: Group88-CognitoUserPoolId

  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: Group88-CognitoClientId

  CognitoClientSecret:
    Value: !GetAtt CognitoUserPoolClient.ClientSecret
    Export:
      Name: Group88-CognitoClientSecret



      

