  ######################### ECS Service ########################################
  TerrainService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: arn:aws:ecs:ap-southeast-2:901444280953:cluster/n11547227-prac
      ServiceName: !Ref TerrainServiceName
      TaskDefinition: arn:aws:ecs:ap-southeast-2:901444280953:task-definition/Group-88-Winterscape-terrain:14
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      DeploymentController:
        Type: ECS
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
            - !Ref Subnet3
      LoadBalancers:
        - TargetGroupArn: !Ref TerrainTargetGroup
          ContainerName: terrain
          ContainerPort: 3002
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref Namespace
        Services:
          - PortName: terrain-3000-tcp
            ClientAliases:
              - Port: 3000
          - PortName: terrainstyles-3004-tcp
            ClientAliases:
              - Port: 3004
                DnsName: terrainstyles
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au

  TerrainstylesService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: arn:aws:ecs:ap-southeast-2:901444280953:cluster/n11547227-prac
      ServiceName: !Ref TerrainStylesServiceName
      TaskDefinition: arn:aws:ecs:ap-southeast-2:901444280953:task-definition/Group-88-Winterscape-terrainstyles:5
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      DeploymentController:
        Type: ECS
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
            - !Ref Subnet3
      LoadBalancers:
        - TargetGroupArn: !Ref TerrainstylesTargetGroup
          ContainerName: terrainstyles
          ContainerPort: 3004
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !Ref Namespace
        Services:
          - PortName: terrainstyles-3004-tcp
            DiscoveryName: terrainstyles-3004-tcp
            ClientAliases:
              - Port: 3004
                DnsName: terrainstyles
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au

  SnowService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: arn:aws:ecs:ap-southeast-2:901444280953:cluster/n11547227-prac
      ServiceName: !Ref SnowServiceName
      TaskDefinition: arn:aws:ecs:ap-southeast-2:901444280953:task-definition/Group-88-Winterscape-snow:6
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      DeploymentController:
        Type: ECS      
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
            - !Ref Subnet3
      LoadBalancers:
        - TargetGroupArn: !Ref SnowTargetGroup
          ContainerName: snow
          ContainerPort: 3001
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au

  AuthdataService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: arn:aws:ecs:ap-southeast-2:901444280953:cluster/n11547227-prac
      ServiceName: !Ref AuthdataServiceName
      TaskDefinition: arn:aws:ecs:ap-southeast-2:901444280953:task-definition/Group-88-Winterscape-authdata:6
      DesiredCount: 1
      LaunchType: FARGATE
      DeploymentConfiguration:
        MinimumHealthyPercent: 50
        MaximumPercent: 200
      DeploymentController:
        Type: ECS
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref SecurityGroup
          Subnets:
            - !Ref Subnet1
            - !Ref Subnet2
            - !Ref Subnet3
      LoadBalancers:
        - TargetGroupArn: !Ref AuthdataTargetGroup
          ContainerName: authdata
          ContainerPort: 3003
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au

  ################ Scalable targets ###############################
  TerrainServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: TerrainService
    Properties:
      MaxCapacity: 4
      MinCapacity: 1
      ResourceId: !Sub service/${EcsClusterName}/${TerrainServiceName}
      RoleARN: arn:aws:iam::901444280953:role/Execution-Role-CAB432-ECS
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  TerrainstylesServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: TerrainstylesService
    Properties:
      MaxCapacity: 2
      MinCapacity: 1
      ResourceId: !Sub service/${EcsClusterName}/${TerrainStylesServiceName}
      RoleARN: arn:aws:iam::901444280953:role/Execution-Role-CAB432-ECS
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  SnowServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: SnowService
    Properties:
      MaxCapacity: 4
      MinCapacity: 1
      ResourceId: !Sub service/${EcsClusterName}/${SnowServiceName}
      RoleARN: arn:aws:iam::901444280953:role/Execution-Role-CAB432-ECS
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs

  AuthdataServiceScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: AuthdataService
    Properties:
      MaxCapacity: 2
      MinCapacity: 1
      ResourceId: !Sub service/${EcsClusterName}/${AuthdataServiceName}
      RoleARN: arn:aws:iam::901444280953:role/Execution-Role-CAB432-ECS
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
  
  ############# Scaling Policies ###############################
  TerrainServiceScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: TerrainServiceCpuScalingPolicy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref TerrainServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60

  TerrainstylesServiceScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: TerrainstylesServiceCpuScalingPolicy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref TerrainstylesServiceScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        TargetValue: 70.0
        ScaleInCooldown: 60
        ScaleOutCooldown: 60  

  SnowServiceScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: SnowServiceCpuScalingPolicy
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref SnowServiceScalableTarget
