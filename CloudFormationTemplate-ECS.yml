Description: Launches an EC2 instance via AutoScalingGroup and runs the Terrain Generator container

Parameters:
####### Tags ###############################
  QutUsername:
    Type: String
    Default: n11547227@qut.edu.au
  QutUsername2:
    Type: String
    Default: n11596708@qut.edu.au
  Purpose:
    Type: String
    Default: assessment 3

####### Networking ###############################
  Subnet1:
    Type: String
    Default: subnet-075811427d5564cf9
  Subnet2:
    Type: String
    Default: subnet-05a3b8177138c8b14
  Subnet3:
    Type: String
    Default: subnet-04ca053dcbe5f49cc
  SecurityGroup:
    Type: String
    Default: sg-032bd1ff8cf77dbb9
  VPCId:
    Type: String
    Default: vpc-007bab53289655834
  Namespace:
    Type: String
    Default: arn:aws:servicediscovery:ap-southeast-2:901444280953:namespace/ns-xnzxrwi3zj6tlv75

####### Application Specific ###############################
  EcsClusterName:
    Type: String
    Default: Group-88-A3
    Description: Name of the ECS Cluster
  TerrainServiceName:
    Type: String
    Default: Group-88-Winterscape-terrain-service-1
    Description: ECS service name for the Terrain service
  TerrainStylesServiceName:
    Type: String
    Default: Group-88-Winterscape-terrainstyles-service-1
    Description: ECS service name for the Terrainstyles service
  SnowServiceName:
    Type: String
    Default: Group-88-Winterscape-snow-service-1
    Description: ECS service name for the Snow service
  AuthdataServiceName:
    Type: String
    Default: Group-88-Winterscape-authdata-service-1
    Description: ECS service name for the Authdata service  


Resources:   

 ##################### Target Groups #####################################
  TerrainTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: Group-88-tg-terrain
      Port: 3002
      Protocol: HTTP
      VpcId: !Ref VPCId
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /terrain/healthcheck
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      TargetType: ip
      ProtocolVersion: HTTP1
      IpAddressType: ipv4
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au

  TerrainstylesTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: Group-88-tg-terrainstyles
      Port: 3004
      Protocol: HTTP
      VpcId: !Ref VPCId
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /style/healthcheck
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      TargetType: ip
      ProtocolVersion: HTTP1
      IpAddressType: ipv4
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au

  SnowTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: Group-88-tg-snow
      Port: 3001
      Protocol: HTTP
      VpcId: !Ref VPCId
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /simulation/healthcheck
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      TargetType: ip
      ProtocolVersion: HTTP1
      IpAddressType: ipv4
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au

  AuthdataTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: Group-88-tg-authdata
      Port: 3003
      Protocol: HTTP
      VpcId: !Ref VPCId
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /healthcheck
      HealthCheckEnabled: true
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 5
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: 200
      TargetType: ip
      ProtocolVersion: HTTP1
      IpAddressType: ipv4
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au

  ######################### Application Load Balancer ########################################
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: Group-88-LB
      Scheme: internet-facing
      Type: application
      Subnets:
        - !Ref Subnet1
        - !Ref Subnet2
        - !Ref Subnet3
      SecurityGroups:
        - !Ref SecurityGroup
      IpAddressType: ipv4
      Tags:
        - Key: purpose
          Value: assessment 3
        - Key: qut-username
          Value: n11547227@qut.edu.au
        - Key: qut-username2
          Value: n11596708@qut.edu.au
  
  ########################## Listeners ########################################
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: arn:aws:acm:ap-southeast-2:901444280953:certificate/d4f46aac-cee6-40e6-94fd-cb5a25485286
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-Res-2021-06
      DefaultActions:
        - Type: forward
          Order: 1
          ForwardConfig:
            TargetGroups:
              - TargetGroupArn: !Ref TerrainTargetGroup
                Weight: 1
            TargetGroupStickinessConfig:
              Enabled: false
              DurationSeconds: 3600
              

  ######################## Rules ########################################
  SnowRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - /simulation
            - /simulation/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref SnowTargetGroup

  TerrainRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 2
      Conditions:
        - Field: path-pattern
          Values:
            - /terrain
            - /terrain/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TerrainTargetGroup

  StyleRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 3
      Conditions:
        - Field: path-pattern
          Values:
            - /style
            - /style/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TerrainstylesTargetGroup

  AuthUserRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 4
      Conditions:
        - Field: path-pattern
          Values:
            - /user
            - /user/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AuthdataTargetGroup

  AuthRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 5
      Conditions:
        - Field: path-pattern
          Values:
            - /auth
            - /auth/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AuthdataTargetGroup

  HealthCheckRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HTTPSListener
      Priority: 6
      Conditions:
        - Field: path-pattern
          Values:
            - /healthcheck
            - /healthcheck/*
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TerrainTargetGroup

