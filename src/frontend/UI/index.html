<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Welcome To WinterScape</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>
  <header>
    <div class="header-buttons">
      <button type="button" id="settings" onclick="go_settings()" style="display:none">Settings</button>
      <button type="button" onclick="go_simulation()">2D Render - Chione Engine</button>
      <button type="button" onclick="go_3d_simulation()">3D Render - Chione Engine</button>
      <button type="button" onclick="go_terrain_generator()">Terrain Generator</button>
      <button type="button" id="login" onclick="go_login()" style="display:none">Login</button>
      <button type="button" id="register" onclick="go_register()" style="display:none">Register</button>
    </div>
  </header>

  <div class="center_container">
    <div id="welcome">
      <h1><strong>Welcome To WinterScape</strong></h1>
      <div id="error" style="color: red; margin-top: 10px;"></div>
    </div>
  </div>

  <script>
    const errorDiv = document.getElementById('error');
    const welcomeDiv = document.getElementById('welcome');
    const id = new URLSearchParams(window.location.search).get('id');

    const userInfo = localStorage.getItem('userInfo');
    const accessToken = localStorage.getItem('accessToken')
    let user = null;

    if (userInfo) {
      try {
        user = JSON.parse(userInfo);
        if (user) {
          welcomeDiv.innerHTML = `<h1><strong>Welcome ${user.username}, To WinterScape</strong></h1>`;
          if (user.id && !id) window.location.href = `index.html?id=${user.id}`;
        } else {
          showGuestMessage();
        }
      } catch (e) {
        showGuestMessage();
      }
    } else {
      showGuestMessage();
      if (id) window.location.href = `/`; // prevent invalid id access
    }

    // Show appropriate buttons
    if (id && user?.id) {
      document.getElementById('settings').style.display = 'inline-block';
    } else {
      document.getElementById('login').style.display = 'inline-block';
      document.getElementById('register').style.display = 'inline-block';
    }

    function showGuestMessage() {
      welcomeDiv.innerHTML = `
        <h1><strong>Welcome To WinterScape:</strong></h1>
        <h4>Please log in to access all features</h4>`;
    }

    // Navigation Functions
    function go_login() {
      window.location.href = 'login.html';
    }

    function go_register() {
      window.location.href = 'register.html';
    }

    function go_simulation() {
      window.location.href = id
        ? `cloud.html?id=${id}`
        : `cloud.html`;
    }

    function removeTokens() {
      localStorage.clear();
    }
    async function go_3d_simulation() {
      try {
        const token = localStorage.getItem('accessToken');
        if (!token) {
          errorDiv.textContent = 'Unauthorized: Please log in!';
          window.location.href = 'login.html';  // Redirect to login page
          return;
        }
        // Send a HEAD request to check the status of terrain.html
        const res = await fetch(`/render_simulation.html`, {
          method: 'HEAD',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (res.ok) {
          window.location.href = id ? `render_simulation.html?id=${id}` : `render_simulation.html`;
        } else if (res.status === 403 || res.status === 401) {
          // If status is 403 Forbidden (token issues), redirect to login page
          errorDiv.textContent = 'Forbidden: You do not have permission to access this page.';
          window.location.href = 'login.html';
          removeTokens();  // Clear the tokens from localStorage
        } else if (res.status === 404) {
          errorDiv.textContent = 'Page Not Found.';
        } else {
          // Handle other error codes (500, etc.)
          errorDiv.textContent = `Error: ${res.statusText}`;
        }
      } catch (error) {
        // If there's a network error, display the error message
        console.error('Error during request:', error);
        errorDiv.textContent = 'Network error: ' + error.message;
      }
    }

    async function go_settings() {
      try {
        const token = localStorage.getItem('accessToken');
        if (!token) {
          errorDiv.textContent = 'Unauthorized: Please log in!';
          window.location.href = 'login.html';  // Redirect to login page
          return;
        }
        // Send a HEAD request to check the status of terrain.html
        const res = await fetch(`/option.html`, {
          method: 'HEAD',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (res.ok) {
          window.location.href = id ? `option.html?id=${id}` : `option.html`;
        } else if (res.status === 403 || res.status === 401) {
          // If status is 403 Forbidden (token issues), redirect to login page
          errorDiv.textContent = 'Forbidden: You do not have permission to access this page.';
          window.location.href = 'login.html';
          removeTokens();  // Clear the tokens from localStorage
        } else if (res.status === 404) {
          errorDiv.textContent = 'Page Not Found.';
        } else {
          // Handle other error codes (500, etc.)
          errorDiv.textContent = `Error: ${res.statusText}`;
        }
      } catch (error) {
        // If there's a network error, display the error message
        console.error('Error during request:', error);
        errorDiv.textContent = 'Network error: ' + error.message;
      }
    }

    async function go_terrain_generator() {
      try {
        const token = localStorage.getItem('accessToken');
        if (!token) {
          errorDiv.textContent = 'Unauthorized: Please log in!';
          window.location.href = 'login.html';  // Redirect to login page
          return;
        }

        // Send a HEAD request to check the status of terrain.html
        const res = await fetch(`/terrain.html`, {
          method: 'HEAD',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          }
        });

        if (res.ok) {
          window.location.href = id ? `terrain.html?id=${id}` : `terrain.html`;
        } else if (res.status === 403 || res.status === 401) {
          // If status is 403 Forbidden (token issues), redirect to login page
          errorDiv.textContent = 'Forbidden: You do not have permission to access this page.';
          window.location.href = 'login.html';
          removeTokens();  // Clear the tokens from localStorage
        } else if (res.status === 404) {
          errorDiv.textContent = 'Page Not Found.';
        } else {
          // Handle other error codes (500, etc.)
          errorDiv.textContent = `Error: ${res.statusText}`;
        }
      } catch (error) {
        // If there's a network error, display the error message
        console.error('Error during request:', error);
        errorDiv.textContent = 'Network error: ' + error.message;
      }
    }

  </script>
</body>

</html>
