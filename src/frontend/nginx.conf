worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;

    server {
        listen 80;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /user/ {
            proxy_pass http://authdata:3003/;
            proxy_set_header Host $host;
        }

        location /terrain/ {
            proxy_pass http://terrain:3002/;
            proxy_set_header Host $host;
        }

        location /simulation/ {
            proxy_pass http://snow:3001/;
            proxy_set_header Host $host;
        }
    }
}
